# ==================================
# CONFIGURAÇÃO DO SPRING BOOT
# ==================================

# para o seu React conseguir mostrar o texto do erro para o usuário.
server.error.include-message=always


# Conexão com o Banco de Dados
# No Docker, ele vai usar o host 'db' (que vem do docker-compose)
# Se rodar local, ele usará 'localhost'
# Garanta que estas linhas estejam no seu application.properties
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB_NAME}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Habilita o Flyway (redundante, mas bom para clareza)
spring.flyway.enabled=true


# Redis
# No Docker, usa o host 'cache'. Localmente, 'localhost'.
spring.data.redis.host=${REDIS_HOST:cache}
spring.data.redis.port=6379

# =======================================
# MONGODB CONFIG
# =======================================
# Conecta ao serviço 'mongo' do seu docker-compose.
# Usa as variáveis de ambiente que você definiu no docker-compose.
spring.data.mongodb.uri=mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin

# Configuração do Google OAuth2
# Ele vai ler as variáveis GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET do .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
# Mapeia a URL de redirecionamento para o Spring Security
spring.security.oauth2.client.registration.google.redirect-uri=${VITE_GENERAL_URL}/login/oauth2/code/google

# Configuração do JWT (Lido pelo @Value no JwtUtils)
# O Java pede "app.jwt.secret", que pega o valor de "JWT_SECRET_KEY" do .env
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_TIME}

# URLs da Aplicação (Lido pelo @Value em outras classes)
# (A URL para onde o Spring redireciona o usuário após o login do Google)
# A rota limpa definida no seu App.tsx é /auth/callback
app.oauth2.redirect-url=${FRONTEND_MAIN_URL}/auth/callback

# (A URL que o CORS deve permitir)
app.cors.allowed-origin=${FRONTEND_CORS_URLS}

# URL da página de criação de senha no Frontend
app.frontend.create-password-url=${FRONTEND_MAIN_URL}/definir-senha?id=

# Faz o Spring respeitar o protocolo original (HTTPS) vindo do Ngrok
server.forward-headers-strategy=framework

# Chave de API do Google (Lido pelo @Value em MapsController)
app.google.api-key=${GOOGLE_API_KEY}

# ==================================
# CONFIGURAÇÃO DE LOGGING
# ==================================
logging.file.name=logs/usafa-backend.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.file.total-size-cap=100MB

# Mudei para INFO para você ver os logs de inicialização agora
logging.level.root=INFO 
logging.level.br.edu.fatecpg.usafa=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# Formato
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n