
services:
  # 1. Aplicativo Spring Boot
  backend:
    build: ./backend
    restart: always
    ports:
      - "8080:8080"
    env_file: .env # Correto, injeta todas as variáveis [cite: 1]
    depends_on:
      - db
      - cache
      - mongo # <-- ADICIONADO
    networks: # <-- ADICIONADO
      - usafa-network

  # 2. Aplicação Frontend
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    env_file: .env 
    depends_on:
      - backend
    networks: # <-- ADICIONADO
      - usafa-network

  # 3. Banco de Dados PostgreSQL
  # 3. Banco de Dados PostgreSQL
  db:
    image: postgres:17
    restart: always
    environment: 
        POSTGRES_DB: ${POSTGRES_DB_NAME}
        POSTGRES_USER: ${POSTGRES_DB_USER}
        POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    # Note que agora ports, volumes e networks estão alinhados com 'environment' (à esquerda)
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - usafa-network

  # 4. Cache Redis
  cache:
    image: redis:latest
    command: redis-server --appendonly yes
    restart: always
    ports:
      - "6379:6379"
    networks: # <-- ADICIONADO
      - usafa-network
    volumes:
      - ./redis-data:/data  

  # 6. Banco de Dados MongoDB (NOVO)
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_DB_USER} # Use variáveis do seu .env
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_DB_PASSWORD} # Use variáveis do seu .env
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME} # Use variáveis do seu .env
    volumes:
      - mongo-data:/data/db
    networks: # <-- ADICIONADO
      - usafa-network

# Bloco de Volumes (Atualizado)
volumes:
  pgdata:
  mongo-data: # <-- ADICIONADO

# Bloco de Redes (Novo)
networks:
  usafa-network:
    driver: bridge